# ==============================================================================
# MedCore HMS — Production Docker Compose Orchestrator
# Multi-tenant Hospital Management System (Frontend + Backend + Redis + Nginx)
# ==============================================================================

services:
  # 1. Reverse Proxy & Edge Security (Nginx)
  nginx:
    image: nginx:1.27-alpine
    container_name: medcore-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs:ro
      - certbot_challenge:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - medcore_prod_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # 2. NestJS Backend API & WebSocket Gateway
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medcore-prod-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.medcore.io}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    volumes:
      - medcore_prod_uploads:/app/backend/uploads
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medcore_prod_net
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # 3. Next.js 15 Web Application Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: medcore-prod-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.medcore.io/api/v1}
    expose:
      - "3000"
    networks:
      - medcore_prod_net
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 4. Redis In-Memory Cache & BullMQ Queue Broker
  redis:
    image: redis:7-alpine
    container_name: medcore-prod-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - medcore_prod_redis_data:/data
    expose:
      - "6379"
    networks:
      - medcore_prod_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 5. Optional Self-Hosted PostgreSQL 16 (for non-RDS on-premise environments)
  postgres:
    profiles: ["standalone"]
    image: postgres:16-alpine
    container_name: medcore-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medcore_prod}
      POSTGRES_USER: ${POSTGRES_USER:-medcore_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - medcore_prod_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - medcore_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcore_admin} -d ${POSTGRES_DB:-medcore_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medcore_prod_uploads:
  medcore_prod_redis_data:
  medcore_prod_postgres_data:
  nginx_certs:
  certbot_challenge:

networks:
  medcore_prod_net:
    driver: bridge
